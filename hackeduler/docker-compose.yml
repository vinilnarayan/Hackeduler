# Local / evaluation deployment. For production: put TLS in front of `frontend`,
# set strong secrets in .env, HACKEDULER_ENVIRONMENT=production, HACKEDULER_COOKIE_SECURE=true, HACKEDULER_SEED=none.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackeduler}
      POSTGRES_USER: ${POSTGRES_USER:-hackeduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackeduler} -d ${POSTGRES_DB:-hackeduler}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    command: ["api"]
    env_file: .env
    environment:
      HACKEDULER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hackeduler}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hackeduler}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["worker"]
    env_file: .env
    environment:
      HACKEDULER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hackeduler}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hackeduler}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      # Host port the app is served on (HACKEDULER_HTTP_PORT). HACKEDULER_BIND_ADDRESS=127.0.0.1 keeps it
      # private to the server, e.g. when an existing nginx/Apache/IIS on the host proxies a DNS name to it.
      - "${HACKEDULER_BIND_ADDRESS:-0.0.0.0}:${HACKEDULER_HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

  # Optional built-in HTTPS front (profile "https") serving https://HACKEDULER_DOMAIN with automatic
  # Let's Encrypt, company-provided certificate files (./certs) or an internal self-signed certificate.
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    ports:
      - "${HACKEDULER_HTTPS_PORT:-443}:443"
      - "${HACKEDULER_HTTP_REDIRECT_PORT:-80}:80"
    environment:
      HACKEDULER_DOMAIN: ${HACKEDULER_DOMAIN:-localhost}
      HACKEDULER_CADDY_TLS: ${HACKEDULER_CADDY_TLS:-internal}
      HACKEDULER_HTTPS_PORT_SUFFIX: ${HACKEDULER_HTTPS_PORT_SUFFIX:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  # Automatic database backups: one dump every HACKEDULER_BACKUP_INTERVAL_HOURS (default 24) into
  # ./backups on the host, keeping HACKEDULER_BACKUP_KEEP_DAYS (default 14) days of backups.
  backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${POSTGRES_USER:-hackeduler}
      DB_NAME: ${POSTGRES_DB:-hackeduler}
      INTERVAL_HOURS: ${HACKEDULER_BACKUP_INTERVAL_HOURS:-24}
      KEEP_DAYS: ${HACKEDULER_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/auto-backup.sh:/auto-backup.sh:ro
    entrypoint: ["/bin/sh", "/auto-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Development mail catcher - view sent notifications at http://localhost:8025. Remove in production.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    profiles: ["dev"]

volumes:
  # The database volume is EXTERNAL: Docker Compose never creates or deletes it, so no compose
  # command (not even "docker compose down -v") can wipe your data, and every rebuild/upgrade
  # reuses it. ./deploy.sh creates it on first install and finds it on upgrades.
  pgdata:
    external: true
    name: ${HACKEDULER_DB_VOLUME:-hackeduler_pgdata}
  caddy_data:     # HTTPS certificates (re-issued automatically if lost)
  caddy_config:
